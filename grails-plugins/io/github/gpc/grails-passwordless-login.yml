name: grails-passwordless-login
desc: Magic link and passkey (WebAuthn) sign-in for Grails applications, on plain Spring Security. The
  plugin handles single-use login tokens, rate limits, passkey registration and the session, while the
  application supplies the users, how a link is delivered and what the session principal holds.
